name: Living Entity API checks

on:
  push:
    branches: [feature/living-entity-api]
    paths:
      - "crates/horizon-mods/**"
      - "crates/horizon-client/src/mod_content.rs"
      - "crates/horizon-client/src/mobs.rs"
      - "docs/mods.md"
      - ".github/workflows/living-entity-api.yml"
  pull_request:
    paths:
      - "crates/horizon-mods/**"
      - "crates/horizon-client/src/mod_content.rs"
      - "crates/horizon-client/src/mobs.rs"
      - "docs/mods.md"
      - ".github/workflows/living-entity-api.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test content declarations
        run: cargo test -p horizon-mods content::tests:: --lib
      - name: Check client entity runtime
        run: cargo check -p horizon-client --lib
