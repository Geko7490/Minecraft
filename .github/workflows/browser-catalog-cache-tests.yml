name: Browser catalogue cache tests

on:
  push:
    branches: [android, "codex/**"]
  pull_request:
    branches: [android]
    paths:
      - "launcher/src/browser/horizon.rs"
      - "launcher/src/browser/horizon/**"
      - ".github/workflows/browser-catalog-cache-tests.yml"

permissions:
  contents: read

concurrency:
  group: browser-catalog-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install launcher build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xinput-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Run catalogue cache tests
        run: cargo test --manifest-path launcher/Cargo.toml browser::horizon::tests::catalog_
